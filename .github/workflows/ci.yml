name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate resources
        run: make generate
      - uses: actions/upload-artifact@v4
        with:
          name: generated-resources
          path: provider/resource_gen_*.go
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: generated-resources
          path: provider/
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          args: ./provider/... ./codegen/...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [generate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: generated-resources
          path: provider/
      - name: Run unit tests
        run: go test -v -count=1 -race ./provider/... ./codegen/...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pulumi/actions@v6
        with:
          pulumi-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: generated-resources
          path: provider/
      - name: Build provider
        run: make provider
      - name: Generate schema
        run: make schema
      - name: Verify schema is up to date
        run: git diff --exit-code schema.json
      - name: Generate SDKs
        run: make codegen
