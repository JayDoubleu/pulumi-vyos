version: "2"
run:
  timeout: 10m
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - revive
  exclusions:
    generated: strict
    paths:
      - sdk
      - examples
      - "provider/resource_gen_.*\\.go"
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
formatters:
  enable:
    - gofumpt
  exclusions:
    generated: strict
    paths:
      - sdk
      - examples
      - "provider/resource_gen_.*\\.go"
