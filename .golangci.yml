version: "2"
run:
  exclude-dirs:
    - sdk
    - examples
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - misspell
    - revive
formatters:
  enable:
    - gofumpt
linters-settings:
  revive:
    rules:
      - name: exported
        arguments:
          - disableStutteringCheck
